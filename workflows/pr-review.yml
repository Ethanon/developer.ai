name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Three skip conditions:
    #   1. Fork PRs — repo secrets aren't exposed to fork workflows under plain
    #      pull_request events. Fork PRs short-circuit before any agent runs.
    #   2. Renovate PRs — dependency bumps don't need agent review and burn
    #      Claude tokens for no signal. Standard CI still runs on those.
    #   3. PRs with the `skip-ci` label — large infrastructure or doc PRs
    #      where agent review burns tokens without exercising any code path
    #      the change touches. Add the label on the PR to skip; remove it
    #      and push an empty commit to re-fire.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Generic stack:         [bob_engineering, alice_security]
        # + clean-code reviewer: [bob_engineering, alice_security, gomez_cleancode]
        # + frontend (UX too):   [bob_engineering, alice_security, gomez_cleancode, carl_ux]
        # The installer adjusts this list based on your wizard answers; you
        # don't have to pick variants by hand. Single-file agents (no _pwa
        # split) — frontend-specific rules live inline in alice_security
        # and bob_engineering, tagged Architecture-Conditional, and the
        # installer strips them at install time for non-frontend projects.
        agent: [bob_engineering, alice_security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CLAUDE_CODE_OAUTH_TOKEN is configured
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN repository secret is not set. Run 'claude setup-token' locally and add the value at Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN is present."
      - name: Run ${{ matrix.agent }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "renovate[bot]"
          claude_args: |
            --model sonnet
            --effort medium
          prompt: |
            Invoke the ${{ matrix.agent }} subagent to review PR #${{ github.event.pull_request.number }}.
            Use the Task tool with subagent_type "${{ matrix.agent }}" and pass the PR number as the target.
            The agent's full spec lives at .claude/agents/${{ matrix.agent }}.md — follow it exactly.
            Do not repeat findings that appear in the PR's existing reviews (the spec covers this).
            Return only the review URL.

  # Second pass: Jekyll (whitehat) and Hyde (blackhat) critique Alice's and
  # Bob's posted findings. `needs: review` keeps them off the PR until both
  # first-pass reviews have landed, so there's actually something to critique.
  critique:
    needs: review
    # Same three skip conditions as the review job. The label check is
    # technically redundant (critique needs review, which already skipped),
    # but keeping it explicit makes the workflow readable on its own.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [jekyll_whitehat, hyde_blackhat]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CLAUDE_CODE_OAUTH_TOKEN is configured
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN repository secret is not set. Run 'claude setup-token' locally and add the value at Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN is present."
      - name: Run ${{ matrix.agent }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "renovate[bot]"
          claude_args: |
            --model sonnet
            --effort medium
          prompt: |
            Invoke the ${{ matrix.agent }} subagent to critique the review comments on PR #${{ github.event.pull_request.number }}.
            Use the Task tool with subagent_type "${{ matrix.agent }}" and pass the PR number as the target.
            The agent's full spec lives at .claude/agents/${{ matrix.agent }}.md — follow it exactly.
            Alice and Bob have already posted their reviews; your job is to critique theirs, not re-review the diff from scratch.
            Return only the review URL.
