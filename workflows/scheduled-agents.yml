name: Scheduled Agents

# Every job here is a thin call into ./.github/workflows/run-agent.yml, which
# owns the checkout, the token pre-flight, and the claude-code-action call.
# What lives in this file is only what genuinely differs per agent: when it
# fires, which model it runs on, and what it is asked to produce.
#
# Adding an agent means adding one job below and one entry in the dispatch
# choice list above it. Nothing else.

on:
  schedule:
    # Weekly audit scanners: Mondays at 9am UTC
    - cron: '0 9 * * 1'
    # Audit-groomer: Mondays at noon UTC (3 hours after scanners, absorbs schedule skew)
    - cron: '0 12 * * 1'
    # Daily agents: every day at 8am UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run (leave blank to run all scheduled for today)'
        required: false
        type: choice
        options:
          - ''
          - scrum_master
          - market_watch
          - hanging_refs
          - naming_audit
          - class_size_audit
          - security_audit
          - prompt_audit
          - flaky_test_finder
          - release_audit
          - audit_groomer
          - feature_agent
          - story_groomer

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ─── Weekly agents (run on Mondays only, or on manual dispatch) ─────────────

  weekly-scrum-master:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'scrum_master'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: scrum_master
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  weekly-market-watch:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'market_watch'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: market_watch
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  weekly-hanging-refs:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'hanging_refs'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: hanging_refs
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  weekly-naming-audit:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'naming_audit'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: naming_audit
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  weekly-class-size-audit:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'class_size_audit'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: class_size_audit
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  weekly-security-audit:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'security_audit'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: security_audit
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  # Optional: only runs if your project ships LLM prompts. Skip otherwise.
  weekly-prompt-audit:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'prompt_audit'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: prompt_audit
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  # Optional: only runs if your CI emits JUnit XML and uploads it as a
  # test-results-* artifact. The agent gracefully bootstraps (Phase 1
  # skipped, static analysis only) if no artifacts exist yet.
  #
  # This is the one job that narrows its own permissions rather than
  # inheriting the workflow defaults: it reads the Actions API and writes a
  # report, and needs nothing else.
  weekly-flaky-test-finder:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'flaky_test_finder'))
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: flaky_test_finder
      needs_actions_api: true
      instructions: |
        Pull CI run history via the GitHub Actions API (GITHUB_TOKEN and GITHUB_REPO are set in the environment), download JUnit XML artifacts, classify tests as REAL_FAILURE / FLAKY / STATIC_SMELL, and write the timestamped report under .claude/reports/.
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  # Optional but recommended: scans for "is this safe to ship?" signals, such as
  # migrations without rollback, env-var drift, stale feature flags, and missing
  # health checks. Use the report before any production deploy.
  weekly-release-audit:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'release_audit'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: release_audit
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  # ─── Audit-groomer (turns audit reports into labeled issues) ────────────────
  # Runs Mondays at noon UTC, three hours after the audit scanners, so all
  # reports are in place before the groomer reads them.

  weekly-audit-groomer:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'audit_groomer'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: audit_groomer
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.

  # ─── Daily agents (run every day) ───────────────────────────────────────────

  # The only agent on the larger model. It writes design documents and makes
  # scope calls the audit scanners never have to make.
  daily-feature-agent:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'feature_agent'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: feature_agent
      model: claude-opus-5
      effort: high
      instructions: |
        Run with mode = work.
        Return only the PR URL or one of the status lines the spec defines.

  daily-story-groomer:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'story_groomer'))
    uses: ./.github/workflows/run-agent.yml
    secrets: inherit
    with:
      agent: story_groomer
      instructions: |
        Write the report under .claude/reports/, then commit and push it. A report left only in the runner is gone when the job ends.
        Return only the report file path.
