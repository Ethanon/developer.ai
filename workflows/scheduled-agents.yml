name: Scheduled Agents

on:
  schedule:
    # Weekly audit scanners — Mondays at 9am UTC
    - cron: '0 9 * * 1'
    # Audit-groomer — Mondays at noon UTC (3 hours after scanners; absorbs schedule skew)
    - cron: '0 12 * * 1'
    # Daily agents — every day at 8am UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run (leave blank to run all scheduled for today)'
        required: false
        type: choice
        options:
          - ''
          - scrum_master
          - market_watch
          - hanging_refs
          - naming_audit
          - class_size_audit
          - security_audit
          - prompt_audit
          - flaky_test_finder
          - audit_groomer
          - developer_agent
          - story_groomer

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ─── Weekly agents (run on Mondays only, or on manual dispatch) ─────────────

  weekly-scrum-master:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'scrum_master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CLAUDE_CODE_OAUTH_TOKEN is configured
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN repository secret is not set."
            exit 1
          fi
      - name: Run scrum_master
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --effort medium
          prompt: |
            Invoke the scrum_master subagent.
            The agent's full spec lives at .claude/agents/scrum_master.md — follow it exactly.
            Return only the report file path.

  weekly-market-watch:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent == '' || github.event.inputs.agent == 'market_watch'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
